name = "clearpath-web"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[vars]
# Set secrets via: npx wrangler pages secret put <NAME>
# RESEND_API_KEY
# FORWARD_TO_EMAIL

# Per-IP throttle for /api/notify (namespace ids are account-wide;
# redacted-records uses 1001/1002, the portfolio API 2001/2002)
[[ratelimits]]
name = "NOTIFY_LIMIT"
namespace_id = "3001"
simple = { limit = 3, period = 60 }
